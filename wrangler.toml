name = "ciba-ai"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = true

[vars]
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Standalone Garcia Android application ID.
ALLOWED_APP_IDS = "com.ciba.garcia"
MAX_OUTPUT_TOKENS = "512"
ALLOWED_ORIGINS = ""
GITHUB_REPOSITORY = "fabiociba7-br/ciba-ai"
GITHUB_BRANCH = "main"
GITHUB_RESEARCH_PUBLISH = "true"
GITHUB_REPORTS_PATH = "reports/garcia-research"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "ciba-ai-db"
database_id = "570aa451-25c5-40a5-8d1b-e9b7cd401c13"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
