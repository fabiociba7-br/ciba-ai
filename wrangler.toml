name = "ciba-ai"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = true

[vars]
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Standalone Garcia Android application ID.
ALLOWED_APP_IDS = "com.ciba.garcia"
MAX_OUTPUT_TOKENS = "512"
ALLOWED_ORIGINS = ""
GARCIA_IMAGE_MODEL = "@cf/black-forest-labs/flux-2-klein-4b"
GARCIA_VISION_MODEL = "@cf/google/gemma-4-26b-a4b-it"
PUBLIC_API_BASE_URL = ""
ARTIFACT_URL_TTL_SECONDS = "2592000"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "GARCIA_ARTIFACTS"
bucket_name = "garcia-artifacts"

[[kv_namespaces]]
binding = "GARCIA_PROMPT_CACHE"
id = "00000000000000000000000000000000"

[[d1_databases]]
binding = "DB"
database_name = "ciba-ai-db"
database_id = "570aa451-25c5-40a5-8d1b-e9b7cd401c13"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]

[observability]
enabled = true

[observability.logs]
invocation_logs = true
head_sampling_rate = 1
