name = "ciba-ai"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = true

[vars]
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
# Keep empty until the real Android application IDs are confirmed.
ALLOWED_APP_IDS = "com.ciba.garcia"
DAILY_GLOBAL_LIMIT = "50"
DAILY_APP_LIMIT = "25"
DAILY_DEVICE_LIMIT = "10"
MAX_OUTPUT_TOKENS = "512"
ALLOWED_ORIGINS = ""

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "ciba-ai-db"
database_id = "570aa451-25c5-40a5-8d1b-e9b7cd401c13"
migrations_dir = "migrations"

[triggers]
crons = ["17 3 * * *"]
