[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garcia-research"
version = "0.1.0"
description = "Optional Python research tooling for Garcia"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["garcia_research*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
addopts = "-q"
