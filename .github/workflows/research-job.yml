name: Garcia Research Job

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Security or technology topic"
        required: true
        type: string
      depth:
        description: "Research breadth"
        required: true
        type: choice
        options:
          - quick
          - standard
          - deep
        default: standard
      focus:
        description: "Comma-separated focus keywords"
        required: false
        type: string
      request_id:
        description: "Correlation ID generated by the Garcia Worker"
        required: true
        type: string
      publish:
        description: "Commit and push report to the checked-out branch"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: garcia-research-${{ github.ref }}-${{ inputs.request_id }}
  cancel-in-progress: false

run-name: "Garcia research: ${{ inputs.topic }} [${{ inputs.request_id }}]"

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requested branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install research package
        run: python -m pip install -e .

      - name: Run Garcia research
        env:
          TOPIC: ${{ inputs.topic }}
          DEPTH: ${{ inputs.depth }}
          FOCUS: ${{ inputs.focus }}
          PUBLISH: ${{ inputs.publish }}
          BRANCH: ${{ github.ref_name }}
        run: |
          args=(--topic "$TOPIC" --depth "$DEPTH" --branch "$BRANCH" --json-output)
          IFS=',' read -ra focus_items <<< "$FOCUS"
          for item in "${focus_items[@]}"; do
            item="$(echo "$item" | xargs)"
            if [ -n "$item" ]; then args+=(--focus "$item"); fi
          done
          if [ "$PUBLISH" = "true" ]; then
            args+=(--publish)
          else
            args+=(--no-publish)
          fi
          python -m garcia_research "${args[@]}" > research-result.json

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: garcia-research-report-${{ inputs.request_id }}
          path: |
            research-result.json
            reports/research/
          if-no-files-found: error
          retention-days: 14
