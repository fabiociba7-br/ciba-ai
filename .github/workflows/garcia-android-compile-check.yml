name: Garcia Android Compile Check

on:
  workflow_dispatch:
  push:
    paths:
      - "garcia-android/**"
      - ".github/workflows/garcia-android-compile-check.yml"

permissions:
  contents: read

concurrency:
  group: garcia-android-compile-check
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Android sources without producing an APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garcia-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Compile debug Kotlin sources
        run: gradle --no-daemon :app:externalNativeBuildDebug :app:compileDebugKotlin
