name: Garcia Android Compile Check

# Android source changes are compiled automatically; no APK is assembled.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/garcia-research-package
    paths:
      - "garcia-android/**"
      - ".github/workflows/garcia-android-compile-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "garcia-android/**"
      - ".github/workflows/garcia-android-compile-check.yml"

permissions:
  contents: read

concurrency:
  group: garcia-android-compile-check
  cancel-in-progress: true

jobs:
  compile:
    name: Compile Android sources without producing an APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garcia-android
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Java 17
      ...
