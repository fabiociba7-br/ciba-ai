name: Garcia Text Chat Test APK

on:
  push:
    branches: [main]
    paths:
      - 'garcia-android/**'
      - '.github/workflows/garcia-android-text-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garcia-text-test-apk
  cancel-in-progress: false

jobs:
  build-test-apk:
    name: Build signed text-chat test APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    defaults:
      run:
        working-directory: garcia-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore private signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/garcia-release.jks"
          chmod 600 "$RUNNER_TEMP/garcia-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/garcia-release.jks" >> "$GITHUB_ENV"
      - name: Build signed text-chat APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleRelease -PVERSION_CODE="$VERSION_CODE" -PVERSION_NAME=1.0.2
      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          sha256sum "$APK" > "$RUNNER_TEMP/garcia-apk-sha256.txt"
          cat "$RUNNER_TEMP/garcia-apk-sha256.txt"
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Garcia-Text-Test-1.0.2-build-${{ github.run_number }}
          path: |
            garcia-android/app/build/outputs/apk/release/*.apk
            ${{ runner.temp }}/garcia-apk-sha256.txt
          if-no-files-found: error
          retention-days: 30