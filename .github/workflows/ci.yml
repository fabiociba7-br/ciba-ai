name: Ciba AI CI

# CI is deliberately manual. Publishing commits must not silently run tests.
# Dispatch this workflow only when the owner explicitly requests validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciba-ai-ci-manual
  cancel-in-progress: true

jobs:
  validate:
    name: Install, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
