name: Python Research Package Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feat/garcia-research-package
      - feat/garcia-cognitive-engine
    paths:
      - "garcia_research/**"
      - "tests/python/**"
      - "pyproject.toml"
      - ".github/workflows/python-research-tests.yml"
  pull_request:
    paths:
      - "garcia_research/**"
      - "tests/python/**"
      - "pyproject.toml"
      - ".github/workflows/python-research-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Python tests
        run: python -m pytest
