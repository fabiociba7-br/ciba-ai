name: Inspect legacy Facebook Android SDK
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect AAR contents and login APIs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fb-inspect
          for name in facebook-login facebook-core facebook-common; do
            echo "========== AAR: $name =========="
            unzip -l "analysis/facebook-sdk-4.42.0/$name.aar" | head -35
            unzip -p "analysis/facebook-sdk-4.42.0/$name.aar" classes.jar > "/tmp/fb-inspect/$name.jar"
            echo "========== LOGIN-RELATED CLASSES: $name =========="
            jar tf "/tmp/fb-inspect/$name.jar" | grep -Ei 'LoginManager|LoginButton|CallbackManager|AccessToken|LoginClient|LoginResult|FacebookSdk|GraphRequest|WebViewLogin|NativeAppLogin|TokenCaching|FacebookException' || true
          done
          echo "========== LOGIN PUBLIC API SIGNATURES =========="
          javap -classpath "/tmp/fb-inspect/facebook-login.jar:/tmp/fb-inspect/facebook-core.jar:/tmp/fb-inspect/facebook-common.jar" -p com.facebook.login.LoginManager com.facebook.login.LoginButton com.facebook.CallbackManager com.facebook.AccessToken com.facebook.FacebookSdk 2>&1 || true
          echo "========== TOKEN / LOGIN STRING REFERENCES =========="
          for j in /tmp/fb-inspect/*.jar; do
            echo "--- $(basename "$j") ---"
            unzip -p "$j" | strings | grep -Ei 'access_token|client_token|app_id|redirect|login_success|cancelled|permissions|publish_actions|read_permissions|oauth' | head -100 || true
          done
