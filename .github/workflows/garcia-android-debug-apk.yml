name: Garcia Android Debug APK

on:
  push:
    branches:
      - feature/garcia-chatterbox-voice-profiles
    paths:
      - '.github/workflows/garcia-android-debug-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garcia-android-debug-apk
  cancel-in-progress: false

jobs:
  build-debug:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: garcia-android
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.2.12479018 cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run tests and build debug APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify APK package
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.ciba.garcia'"
          sha256sum "$APK" > app-debug-sha256.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Garcia-debug-${{ github.run_number }}
          path: |
            garcia-android/app/build/outputs/apk/debug/app-debug.apk
            garcia-android/app-debug-sha256.txt
          if-no-files-found: error
          retention-days: 30
