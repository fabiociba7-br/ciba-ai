name: Ciba AI Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'garcia-android/**'
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciba-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CIBA_AI_ADMIN_TOKEN: ${{ secrets.CIBA_AI_ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate project
        run: npm run check

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if [ "${#CIBA_AI_ADMIN_TOKEN}" -lt 32 ]; then
            echo "::error::Missing or too-short GitHub Actions secret CIBA_AI_ADMIN_TOKEN (minimum 32 characters)"
            exit 1
          fi

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply ciba-ai-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Configure ADMIN_TOKEN as a Worker secret
        shell: bash
        run: printf '%s' "$CIBA_AI_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
