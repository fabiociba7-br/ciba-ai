name: Ciba AI Deploy

# Deploy automatically after commits to main; manual runs remain available.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ciba-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, migrate D1 and deploy Worker
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CIBA_AI_ADMIN_TOKEN: ${{ secrets.CIBA_AI_ADMIN_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Validate project
        run: npm run check

      - name: Validate deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          if [ "${#CIBA_AI_ADMIN_TOKEN}" -lt 32 ]; then
            echo "::error::Missing or too-short GitHub Actions secret CIBA_AI_ADMIN_TOKEN (minimum 32 characters)"
            exit 1
          fi

      - name: Inspect existing private Garcia registrations
        run: |
          npx wrangler d1 execute ciba-ai-db --remote --command "SELECT device_id, owner_id, created_at, revoked_at FROM devices WHERE app_id = 'com.ciba.garcia' ORDER BY created_at DESC" --json
          npx wrangler d1 execute ciba-ai-db --remote --command "SELECT o.owner_id, o.status, i.consumed_device_id, i.created_at, i.consumed_at FROM owners o JOIN owner_pairing_invitations i ON i.owner_id = o.owner_id WHERE i.app_id = 'com.ciba.garcia' ORDER BY i.created_at DESC" --json

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply ciba-ai-db --remote

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Configure ADMIN_TOKEN as a Worker secret
        shell: bash
        run: printf '%s' "$CIBA_AI_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Confirm Worker health
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --fail-with-body --silent --show-error https://ciba-ai.fabiociba7.workers.dev/v1/status)"
          echo "$status" | jq -e '.status == "ready" and .database == "connected" and .ai_enabled == true' >/dev/null
          echo "Ciba AI backend is healthy and ready."
