name = "ciba-ai-test"
main = "src/index.ts"
compatibility_date = "2026-11-15"
workers_dev = false

[vars]
AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
ALLOWED_APP_IDS = ""
DAILY_GLOBAL_LIMIT = "500"
DAILY_APP_LIMIT = "200"
DAILY_DEVICE_LIMIT = "40"
MAX_OUTPUT_TOKENS = "700"
ALLOWED_ORIGINS = ""

[[d1_databases]]
binding = "DB"
database_name = "ciba-ai-test-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
